plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sl.wifiguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sl.wifiguard'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// لا توجد مكتبات خارجية: التطبيق يعتمد على واجهات أندرويد فقط.
