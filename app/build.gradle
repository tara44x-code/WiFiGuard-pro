plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sl.wifiguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sl.wifiguard'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.2.0'
    }

    signingConfigs {
        // على GitHub: إذا وُجد سر SIGNING_KEY يُوقَّع كل بناء بنفس المفتاح،
        // فيتثبت التحديث فوق النسخة القديمة بدون حذف البيانات.
        debug {
            def ks = System.getenv('WG_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('WG_KEY_PASSWORD')
                keyAlias 'wifiguard'
                keyPassword System.getenv('WG_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // توليد رمز QR لمشاركة الواي فاي (بدون إنترنت).
    implementation 'com.google.zxing:core:3.5.3'
}
